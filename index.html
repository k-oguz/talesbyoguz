<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>talesbyoguz — Apps &amp; Legal</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafafa;
      --fg: #1c1c1e;
      --muted: #525257;
      --card-bg: #ffffff;
      --border: #e5e5ea;
      --accent: #b8400a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111113;
        --fg: #f2f2f7;
        --muted: #a1a1a6;
        --card-bg: #1c1c1e;
        --border: #2c2c2e;
        --accent: #ff9f43;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 20px 64px;
      line-height: 1.65;
      color: var(--fg);
      background: var(--bg);
    }
    h1 { font-size: 1.85rem; margin: 0 0 8px; letter-spacing: -0.02em; }
    h2 { font-size: 1.15rem; margin: 0 0 10px; }
    p { margin: 0 0 14px; }
    .muted { color: var(--muted); font-size: 0.95rem; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 22px;
      margin-top: 24px;
    }
    ul { padding-left: 20px; margin: 8px 0 0; }
    li { margin: 8px 0; }
    a { color: var(--accent); text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 40px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>talesbyoguz</h1>

  <div class="card">

    <ul>
      <li><a href="./privacy/">Privacy Policy</a></li>
      <li><a href="./support/">App Support &amp; Contact</a></li>
      <li><a href="https://www.apple.com/legal/internet-services/itunes/dev/stdeula/">Terms of Use (Apple Standard EULA)</a></li>
    </ul>
  </div>

  <footer class="muted">
    Contact: <a href="mailto:talesbyoguz@gmail.com">talesbyoguz@gmail.com</a>
  </footer>
</body>
</html>
